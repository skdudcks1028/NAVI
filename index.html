<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>카카오내비 동선</title>
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.1.0/kakao.min.js" crossorigin="anonymous"></script>
<style>
body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#f4f4f2;color:#222}
header{position:sticky;top:0;background:#1e2a3a;color:#fff;padding:14px 16px;z-index:2}
header h1{margin:0;font-size:18px}header p{margin:4px 0 0;font-size:13px;opacity:.8}
ul{list-style:none;margin:0;padding:10px}
li{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;display:flex;gap:10px;align-items:center;box-shadow:0 1px 2px rgba(0,0,0,.06)}
li.done{opacity:.45}
.no{min-width:44px;height:44px;border-radius:10px;background:#ff7a00;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px;text-align:center}
.info{flex:1;min-width:0}.nm{font-weight:700;font-size:15px}.ad{font-size:12px;color:#666;margin-top:2px}.nt{font-size:12px;color:#c0392b;margin-top:2px}
.btns{display:flex;flex-direction:column;gap:6px}
button{border:0;border-radius:8px;padding:10px 12px;font-size:14px;font-weight:700}
.go{background:#fee500;color:#191919}.ck{background:#e9e9e9;color:#333;font-size:12px;padding:6px}
#err{display:none;background:#fff3cd;padding:10px 16px;font-size:13px}
</style></head><body>
<header><h1 id="ttl">카카오내비 동선</h1><p>버튼 누르면 카카오내비가 그 곳으로 바로 안내를 시작합니다</p></header>
<div id="err"></div>
<ul id="list"></ul>
<script>
var KEY="d85bb6d2302f055fbd25f2129e691772";
var STOPS=[],TITLE='카카오내비 동선';
try{var raw=decodeURIComponent(location.hash.slice(1));var b=atob(raw.replace(/-/g,'+').replace(/_/g,'/'));var j=JSON.parse(decodeURIComponent(escape(b)));TITLE=j.t;STOPS=j.s.map(function(a){return {no:a[0],name:a[1],bag:a[2],addr:a[3],note:a[4],y:a[5],x:a[6]}});}catch(e){}
document.getElementById('ttl').textContent=TITLE;document.title=TITLE;
if(!STOPS.length){document.getElementById('err').style.display='block';document.getElementById('err').textContent='동선 정보가 없습니다. Claude가 준 오늘 링크로 열어 주세요.';}
var err=document.getElementById('err');
function showErr(m){err.style.display='block';err.textContent=m;}
try{ if(window.Kakao){ if(!Kakao.isInitialized()) Kakao.init(KEY);} else showErr('카카오 SDK를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.'); }catch(e){showErr('카카오 초기화 오류: '+e.message);}
var doneKey='naviDone_'+TITLE;var D={};try{D=JSON.parse(localStorage.getItem(doneKey)||'{}')}catch(e){}
function save(){try{localStorage.setItem(doneKey,JSON.stringify(D))}catch(e){}}
var ul=document.getElementById('list');
STOPS.forEach(function(s,i){
  var li=document.createElement('li'); if(D[i]) li.className='done';
  li.innerHTML='<div class="no">'+s.no+'</div><div class="info"><div class="nm"></div><div class="ad"></div>'+(s.note?'<div class="nt"></div>':'')+'</div><div class="btns"><button class="go">내비</button><button class="ck">완료</button></div>';
  li.querySelector('.nm').textContent=s.name+(s.bag?'  ['+s.bag+']':'');
  li.querySelector('.ad').textContent=s.addr;
  if(s.note) li.querySelector('.nt').textContent=s.note;
  li.querySelector('.go').onclick=function(){
    try{ Kakao.Navi.start({name:s.name,x:s.x,y:s.y,coordType:'wgs84'}); }catch(e){showErr('내비 실행 오류: '+e.message);}
  };
  li.querySelector('.ck').onclick=function(){D[i]=!D[i];li.className=D[i]?'done':'';save();};
  ul.appendChild(li);
});
window.addEventListener('hashchange',function(){location.reload();});
</script></body></html>
